name: Build Driver Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Driver Application
        run: |
          flutter config --no-analytics
          flutter create --org com.taxialbalad --project-name driver_app build_app
          cd build_app
          
          # 1. Logo Dosyası Güvencesi
          mkdir -p assets
          if [ -f "../logo.jpg" ]; then
            cp ../logo.jpg assets/logo.jpg
          elif [ -f "../logo.png" ]; then
            cp ../logo.png assets/logo.jpg
          else
            python3 -c '
          import base64
          raw = ""
          with open("assets/logo.jpg", "wb") as f:
              f.write(base64.b64decode(raw))
          '
          fi

          # 2. pubspec.yaml Tanımı
          cat << 'EOF' > pubspec.yaml
          name: driver_app
          description: Taxi Al Balad Driver Standalone App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^13.0.2
            http: ^1.2.0
            permission_handler: ^11.3.1
            wakelock_plus: ^1.2.8
            flutter_foreground_task: ^7.0.1
          flutter:
            uses-material-design: true
            assets:
              - assets/logo.jpg
          EOF

          flutter pub get

          # 3. Gradle JVM Ayarları
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle

          # 4. ProGuard / R8 Kuralları
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.pravera.flutter_foreground_task.** { *; }
          -keep class com.baseflow.geolocator.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          EOF

          # 5. android/app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.taxialbalad.driver_app"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  applicationId = "com.taxialbalad.driver_app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 6. Android Manifest
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.taxialbalad.driver_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              
              <application
                  android:label="كابتن تكسي البلد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <service 
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:foregroundServiceType="location"
                      android:stopWithTask="false"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 7. Dart Kodu (Her Dakika Bir Bildirim & Konum Gönderimi)
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:isolate';
          import 'package:flutter/material.dart';
          import 'package:flutter_foreground_task/flutter_foreground_task.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:http/http.dart' as http;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          const String FIREBASE_URL = "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/drivers";

          @pragma('vm:entry-point')
          void startCallback() {
            FlutterForegroundTask.setTaskHandler(DriverTaskHandler());
          }

          class DriverTaskHandler extends TaskHandler {
            String? driverKey;

            @override
            void onStart(DateTime timestamp, SendPort? sendPort) async {
              driverKey = await FlutterForegroundTask.getData<String>(key: 'activeDriverKey');
            }

            @override
            void onRepeatEvent(DateTime timestamp, SendPort? sendPort) async {
              driverKey ??= await FlutterForegroundTask.getData<String>(key: 'activeDriverKey');
              if (driverKey == null || driverKey!.isEmpty) return;

              try {
                Position pos = await Geolocator.getCurrentPosition(
                  desiredAccuracy: LocationAccuracy.high,
                );
                int now = DateTime.now().millisecondsSinceEpoch;
                
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$driverKey.json"),
                  body: json.encode({
                    'lat': pos.latitude,
                    'lng': pos.longitude,
                    'latitude': pos.latitude,
                    'longitude': pos.longitude,
                    'speed': pos.speed > 0 ? pos.speed : 0.2,
                    'heading': pos.heading,
                    'bearing': pos.heading,
                    'accuracy': pos.accuracy,
                    'isMoving': true,
                    'status': 'available',
                    'isOnline': true,
                    'online': true,
                    'active': true,
                    'workingStatus': 'working',
                    'lastGpsUpdate': now,
                    'lastActive': now,
                    'timestamp': now,
                    'location': {
                      'lat': pos.latitude,
                      'lng': pos.longitude,
                      'latitude': pos.latitude,
                      'longitude': pos.longitude,
                      'speed': pos.speed > 0 ? pos.speed : 0.2,
                      'heading': pos.heading,
                      'timestamp': now,
                    }
                  }),
                );

                FlutterForegroundTask.updateService(
                  notificationTitle: '🚖 كابتن تكسي البلد',
                  notificationText: 'تم تحديث الموقع بنجاح • أنت متصل بالخدمة',
                );
              } catch (_) {}
            }

            @override
            void onDestroy(DateTime timestamp, SendPort? sendPort) async {}

            @override
            void onNotificationButtonPressed(String id) {}

            @override
            void onNotificationPressed() {}

            @override
            void onNotificationDismissed() {}
          }

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: DriverApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class DriverApp extends StatefulWidget {
            const DriverApp({super.key});

            @override
            State<DriverApp> createState() => _DriverAppState();
          }

          class _DriverAppState extends State<DriverApp> with WidgetsBindingObserver {
            final _phone = TextEditingController();
            final _pass = TextEditingController();
            bool isOnline = false;
            bool isLoading = false;
            String driverName = "Ahmad";
            String driverId = "12345";
            String driverCity = "اللاذقية";
            int remainingDays = 7;
            String expiryDate = "5/9/2026";
            String activeKey = "";
            String liveGpsText = "GPS نشط (جاري الإرسال...)";
            Timer? _locationTimer;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _initForegroundTask();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _requestInitialPermissions();
              });
            }

            Future<void> _requestInitialPermissions() async {
              await Permission.notification.request();
              LocationPermission permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
              }
              if (permission == LocationPermission.whileInUse || permission == LocationPermission.always) {
                await Permission.locationAlways.request();
              }
              await Permission.ignoreBatteryOptimizations.request();
            }

            void _initForegroundTask() {
              FlutterForegroundTask.init(
                androidNotificationOptions: AndroidNotificationOptions(
                  channelId: 'taxi_driver_minutely_status',
                  channelName: 'خدمة التتبع المباشر',
                  channelDescription: 'إرسال موقع السائق كل دقيقة باستمرار',
                  channelImportance: NotificationChannelImportance.HIGH,
                  priority: NotificationPriority.HIGH,
                  playSound: true,
                  enableVibration: true,
                  showWhen: true,
                ),
                iosNotificationOptions: const IOSNotificationOptions(),
                foregroundTaskOptions: const ForegroundTaskOptions(
                  interval: 60000,
                  isOnceEvent: false,
                  autoRunOnBoot: true,
                  allowWakeLock: true,
                ),
              );
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _locationTimer?.cancel();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (isOnline) {
                WakelockPlus.enable();
              }
            }

            Future<void> fetchAndSendLocation() async {
              if (activeKey.isEmpty) return;
              try {
                Position pos = await Geolocator.getCurrentPosition(
                  desiredAccuracy: LocationAccuracy.high,
                );
                int now = DateTime.now().millisecondsSinceEpoch;
                
                Map<String, dynamic> payload = {
                  'lat': pos.latitude,
                  'lng': pos.longitude,
                  'latitude': pos.latitude,
                  'longitude': pos.longitude,
                  'speed': pos.speed > 0 ? pos.speed : 0.2,
                  'heading': pos.heading,
                  'bearing': pos.heading,
                  'accuracy': pos.accuracy,
                  'isMoving': true,
                  'status': 'available',
                  'isOnline': true,
                  'online': true,
                  'active': true,
                  'workingStatus': 'working',
                  'lastGpsUpdate': now,
                  'lastActive': now,
                  'timestamp': now,
                  'location': {
                    'lat': pos.latitude,
                    'lng': pos.longitude,
                    'latitude': pos.latitude,
                    'longitude': pos.longitude,
                    'speed': pos.speed > 0 ? pos.speed : 0.2,
                    'heading': pos.heading,
                    'timestamp': now,
                  }
                };

                await http.patch(
                  Uri.parse("$FIREBASE_URL/$activeKey.json"),
                  body: json.encode(payload),
                );

                FlutterForegroundTask.updateService(
                  notificationTitle: '🚖 كابتن تكسي البلد',
                  notificationText: 'تم إرسال الموقع وتحديث الحالة للزبائن',
                );

                if (mounted) {
                  setState(() {
                    liveGpsText = "GPS نشط (الموقع يُرسل كل دقيقة $driverCity)";
                  });
                }
              } catch (_) {}
            }

            Future<void> startTracking(String key) async {
              try {
                await Permission.notification.request();
                LocationPermission permission = await Geolocator.checkPermission();
                if (permission == LocationPermission.denied) {
                  permission = await Geolocator.requestPermission();
                }
                if (permission == LocationPermission.deniedForever) {
                  await openAppSettings();
                  return;
                }

                if (permission == LocationPermission.whileInUse) {
                  await Permission.locationAlways.request();
                }

                await WakelockPlus.enable();
                await Permission.ignoreBatteryOptimizations.request();

                await FlutterForegroundTask.saveData(key: 'activeDriverKey', value: key);

                if (await FlutterForegroundTask.isRunningService) {
                  await FlutterForegroundTask.restartService();
                } else {
                  await FlutterForegroundTask.startService(
                    notificationTitle: '🚖 كابتن تكسي البلد',
                    notificationText: 'أنت متصل بالخدمة الآن (يتم التحديث كل دقيقة)',
                    callback: startCallback,
                  );
                }

                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$key.json"),
                  body: json.encode({
                    'status': 'available',
                    'isOnline': true,
                    'online': true,
                    'active': true,
                    'workingStatus': 'working',
                    'lastActive': now,
                    'timestamp': now,
                  }),
                );

                await fetchAndSendLocation();

                _locationTimer?.cancel();
                _locationTimer = Timer.periodic(const Duration(minutes: 1), (timer) {
                  fetchAndSendLocation();
                });

                if (mounted) {
                  setState(() {
                    isOnline = true;
                  });
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("خطأ: $e")));
                }
              }
            }

            void handlePause() async {
              _locationTimer?.cancel();
              _locationTimer = null;
              WakelockPlus.disable();
              await FlutterForegroundTask.stopService();

              if (activeKey.isNotEmpty) {
                try {
                  int now = DateTime.now().millisecondsSinceEpoch;
                  await http.patch(
                    Uri.parse("$FIREBASE_URL/$activeKey.json"),
                    body: json.encode({
                      'status': 'offline',
                      'isOnline': false,
                      'online': false,
                      'active': false,
                      'isMoving': false,
                      'workingStatus': 'resting',
                      'lastActive': now,
                    }),
                  );
                } catch (_) {}
              }

              setState(() {
                isOnline = false;
              });
            }

            void handleLogout() {
              handlePause();
              _phone.clear();
              _pass.clear();
            }

            void handleLogin() async {
              FocusScope.of(context).unfocus();
              String p = _phone.text.trim().replaceAll(RegExp(r'[^0-9]'), '');
              String pass = _pass.text.trim();
              if (p.isEmpty || pass.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("يرجى إدخال رقم الهاتف ورمز المرور")),
                );
                return;
              }

              if (p.startsWith('0')) p = '963${p.substring(1)}';
              else if (!p.startsWith('963')) p = '963$p';

              setState(() => isLoading = true);

              try {
                final res = await http.get(Uri.parse("$FIREBASE_URL.json"));
                if (res.statusCode == 200 && res.body != "null") {
                  Map data = json.decode(res.body);
                  String? matchKey;
                  Map? matchData;

                  data.forEach((k, v) {
                    String cleanP = (v['phone'] ?? '').toString().replaceAll(RegExp(r'[^0-9]'), '');
                    if (cleanP.contains(p) || p.contains(cleanP)) {
                      if (v['password'].toString() == pass) {
                        matchKey = k;
                        matchData = v;
                      }
                    }
                  });

                  if (matchKey != null && matchData != null) {
                    activeKey = matchKey!;
                    driverName = matchData!['name'] ?? 'Ahmad';
                    driverId = (matchData!['driverId'] ?? matchData!['carNumber'] ?? matchData!['id'] ?? '12345').toString();
                    driverCity = matchData!['city'] ?? 'اللاذقية';
                    remainingDays = matchData!['remainingDays'] ?? 7;
                    expiryDate = matchData!['expiryDate'] ?? '5/9/2026';

                    await startTracking(activeKey);
                  } else {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text("رقم الهاتف أو رمز المرور غير صحيح")),
                      );
                    }
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text("فشل الاتصال: $e")),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => isLoading = false);
                }
              }
            }

            Widget buildTaxiCheckerBorder() {
              return SizedBox(
                height: 12,
                child: Row(
                  children: List.generate(24, (index) => Expanded(
                    child: Container(
                      color: index % 2 == 0 ? const Color(0xFFFFB800) : Colors.black,
                    ),
                  )),
                ),
              );
            }

            Widget buildOriginalLogo() {
              return Container(
                width: 110,
                height: 110,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: Colors.white,
                  border: Border.all(color: const Color(0xFFFFB800), width: 3.5),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withOpacity(0.4),
                      blurRadius: 10,
                      offset: const Offset(0, 3),
                    )
                  ],
                ),
                child: ClipOval(
                  child: Padding(
                    padding: const EdgeInsets.all(4.0),
                    child: Image.asset(
                      'assets/logo.jpg',
                      fit: BoxFit.contain,
                      errorBuilder: (context, error, stackTrace) {
                        return const Icon(Icons.local_taxi, color: Color(0xFFFFB800), size: 48);
                      },
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF101010),
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 20),
                      child: Container(
                        decoration: BoxDecoration(
                          color: const Color(0xFF1C1C1E),
                          borderRadius: BorderRadius.circular(32),
                          border: Border.all(color: const Color(0xFFFFB800), width: 1.5),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(30),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              buildTaxiCheckerBorder(),
                              const SizedBox(height: 22),
                              buildOriginalLogo(),
                              const SizedBox(height: 18),
                              
                              if (!isOnline) ...[
                                const Text(
                                  "تكسي البلد | كابتن",
                                  style: TextStyle(
                                    color: Color(0xFFFFB800),
                                    fontSize: 23,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                const SizedBox(height: 4),
                                const Text(
                                  "بوابة تسجيل دخول السائقين",
                                  style: TextStyle(color: Colors.white60, fontSize: 13),
                                ),
                                const SizedBox(height: 22),
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 20),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.end,
                                    children: [
                                      const Text("رقم الهاتف", style: TextStyle(color: Colors.white70, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 8),
                                      Container(
                                        decoration: BoxDecoration(
                                          color: Colors.white,
                                          borderRadius: BorderRadius.circular(12),
                                        ),
                                        child: TextField(
                                          controller: _phone,
                                          keyboardType: TextInputType.phone,
                                          style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            prefixIcon: Padding(
                                              padding: EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                                              child: Text("+963", style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 16)),
                                            ),
                                            hintText: "980040660",
                                            hintStyle: TextStyle(color: Colors.black26),
                                            contentPadding: EdgeInsets.symmetric(vertical: 13),
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 16),
                                      const Text("رمز المرور (PIN)", style: TextStyle(color: Colors.white70, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 8),
                                      Container(
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF282828),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: Colors.white12),
                                        ),
                                        child: TextField(
                                          controller: _pass,
                                          obscureText: true,
                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            suffixIcon: Icon(Icons.lock, color: Color(0xFFFFB800), size: 20),
                                            contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                                            hintText: "••••",
                                            hintStyle: TextStyle(color: Colors.white24),
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 22),
                                      ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: const Color(0xFFFFB800),
                                          minimumSize: const Size.fromHeight(50),
                                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                          elevation: 4,
                                        ),
                                        onPressed: isLoading ? null : handleLogin,
                                        child: isLoading
                                            ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(color: Colors.black, strokeWidth: 2))
                                            : Row(
                                                mainAxisAlignment: MainAxisAlignment.center,
                                                children: const [
                                                  Text("تسجيل الدخول", style: TextStyle(color: Colors.black, fontSize: 17, fontWeight: FontWeight.w900)),
                                                  SizedBox(width: 8),
                                                  Icon(Icons.login_rounded, color: Colors.black, size: 20),
                                                ],
                                              ),
                                      ),
                                    ],
                                  ),
                                ),
                              ] else ...[
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 18),
                                  child: Column(
                                    children: [
                                      Container(
                                        width: double.infinity,
                                        padding: const EdgeInsets.symmetric(vertical: 8, horizontal: 12),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF1B3D2B).withOpacity(0.6),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: const Color(0xFF2ECC71).withOpacity(0.4)),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: const [
                                            Icon(Icons.check_circle, color: Color(0xFF2ECC71), size: 16),
                                            SizedBox(width: 6),
                                            Text(
                                              "الموقع يُرسل مباشرة • أنت نشط ومتاح للزبائن",
                                              style: TextStyle(color: Color(0xFF2ECC71), fontWeight: FontWeight.bold, fontSize: 12),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 12),

                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 16),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF262628),
                                          borderRadius: BorderRadius.circular(18),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            Container(
                                              padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                                              decoration: BoxDecoration(
                                                color: const Color(0xFF1B3D2B),
