name: Build Driver Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Driver Application
        run: |
          rm -rf *
          flutter config --no-analytics
          flutter create --org com.taxialbalad --project-name driver_app build_app
          cd build_app
          
          # 1. Kütüphaneleri ekle
          flutter pub add flutter_background_service flutter_background_service_android geolocator http permission_handler wakelock_plus

          # 2. JVM Bellek Ayarları
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 3. Kotlin 1.9.22 Güncellemesi
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle

          # 4. SDK Sürümlerini ve Debug İmzasını Ayarla
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

          # 5. Android Manifest (Arka Plan Servis & Lokasyon İzinleri)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.taxialbalad.driver_app">
              
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              
              <application
                  android:label="كابتن تكسي البلد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name="id.flutter.flutter_background_service.BackgroundService"
                      android:foregroundServiceType="location"
                      android:enabled="true"
                      android:exported="true"
                      tools:replace="android:exported" />
                  
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 6. Birebir Arayüz & Kesintisiz Arka Plan GPS Kodu (lib/main.dart)
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter_background_service/flutter_background_service.dart';
          import 'package:flutter_background_service_android/flutter_background_service_android.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:http/http.dart' as http;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          const String FIREBASE_URL = "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/drivers";

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: DriverApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          @pragma('vm:entry-point')
          void onStart(ServiceInstance service) async {
            if (service is AndroidServiceInstance) {
              service.on('setAsForeground').listen((event) {
                service.setAsForegroundService();
              });
              service.on('setAsBackground').listen((event) {
                service.setAsBackgroundService();
              });
            }

            service.on('setDriver').listen((event) {
              if (event != null && event['driverKey'] != null) {
                String driverKey = event['driverKey'];
                
                // Arka planda kesintisiz her 3 saniyede bir GPS güncellemesi
                Timer.periodic(const Duration(seconds: 3), (timer) async {
                  try {
                    bool enabled = await Geolocator.isLocationServiceEnabled();
                    if (!enabled) return;

                    Position pos = await Geolocator.getCurrentPosition(
                      desiredAccuracy: LocationAccuracy.bestForNavigation,
                      timeLimit: const Duration(seconds: 2),
                    );

                    int now = DateTime.now().millisecondsSinceEpoch;
                    await http.patch(
                      Uri.parse("$FIREBASE_URL/$driverKey.json"),
                      body: json.encode({
                        'lat': pos.latitude,
                        'lng': pos.longitude,
                        'latitude': pos.latitude,
                        'longitude': pos.longitude,
                        'speed': pos.speed > 0 ? pos.speed : 0.0,
                        'heading': pos.heading,
                        'bearing': pos.heading,
                        'accuracy': pos.accuracy,
                        'isMoving': pos.speed > 0.5,
                        'status': 'available',
                        'isOnline': true,
                        'online': true,
                        'active': true,
                        'workingStatus': 'working',
                        'lastGpsUpdate': now,
                        'lastActive': now,
                        'timestamp': now,
                      }),
                    );
                  } catch (_) {}
                });
              }
            });

            service.on('stopService').listen((event) {
              service.stopSelf();
            });
          }

          class DriverApp extends StatefulWidget {
            const DriverApp({super.key});

            @override
            State<DriverApp> createState() => _DriverAppState();
          }

          class _DriverAppState extends State<DriverApp> {
            final _phone = TextEditingController();
            final _pass = TextEditingController();
            bool isOnline = false;
            bool isLoading = false;
            String driverName = "Ahmad";
            String driverId = "12345";
            String driverCity = "اللاذقية";
            int remainingDays = 7;
            String expiryDate = "5/9/2026";
            String activeKey = "";

            Future<void> startBackgroundTracking(String key) async {
              await Permission.notification.request();
              await Permission.location.request();
              if (await Permission.location.isGranted) {
                await Permission.locationAlways.request();
              }
              await Permission.ignoreBatteryOptimizations.request();
              await WakelockPlus.enable();

              final service = FlutterBackgroundService();
              await service.configure(
                androidConfiguration: AndroidConfiguration(
                  onStart: onStart,
                  autoStart: false,
                  isForegroundMode: true,
                  notificationChannelId: 'my_foreground',
                  initialNotificationTitle: '🚖 كابتن تكسي البلد',
                  initialNotificationContent: 'أنت متصل الآن وتستقبل طلبات الزبائن',
                  foregroundServiceTypes: [AndroidForegroundType.location],
                ),
                iosConfiguration: IosConfiguration(),
              );

              await service.startService();
              service.invoke('setDriver', {'driverKey': key});
            }

            Future<void> setOfflineOnFirebase(String key) async {
              try {
                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$key.json"),
                  body: json.encode({
                    'status': 'offline',
                    'isOnline': false,
                    'online': false,
                    'active': false,
                    'isMoving': false,
                    'workingStatus': 'resting',
                    'lastActive': now,
                  }),
                );
              } catch (_) {}
            }

            void handleLogin() async {
              FocusScope.of(context).unfocus();
              String p = _phone.text.trim().replaceAll(RegExp(r'[^0-9]'), '');
              String pass = _pass.text.trim();
              if (p.isEmpty || pass.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("يرجى إدخال رقم الهاتف ورمز المرور")),
                );
                return;
              }

              if (p.startsWith('0')) p = '963${p.substring(1)}';
              else if (!p.startsWith('963')) p = '963$p';

              setState(() => isLoading = true);

              try {
                final res = await http.get(Uri.parse("$FIREBASE_URL.json"));
                if (res.statusCode == 200 && res.body != "null") {
                  Map data = json.decode(res.body);
                  String? matchKey;
                  Map? matchData;

                  data.forEach((k, v) {
                    String cleanP = (v['phone'] ?? '').toString().replaceAll(RegExp(r'[^0-9]'), '');
                    if (cleanP.contains(p) || p.contains(cleanP)) {
                      if (v['password'].toString() == pass) {
                        matchKey = k;
                        matchData = v;
                      }
                    }
                  });

                  if (matchKey != null && matchData != null) {
                    activeKey = matchKey!;
                    driverName = matchData!['name'] ?? 'Ahmad';
                    driverId = (matchData!['driverId'] ?? matchData!['carNumber'] ?? '12345').toString();
                    driverCity = matchData!['city'] ?? 'اللاذقية';
                    
                    await startBackgroundTracking(activeKey);

                    if (mounted) {
                      setState(() {
                        isOnline = true;
                      });
                    }
                  } else {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text("رقم الهاتف أو رمز المرور غير صحيح")),
                      );
                    }
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text("فشل الاتصال: $e")),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => isLoading = false);
                }
              }
            }

            void handlePause() async {
              FlutterBackgroundService().invoke('stopService');
              WakelockPlus.disable();
              if (activeKey.isNotEmpty) {
                await setOfflineOnFirebase(activeKey);
              }
              setState(() {
                isOnline = false;
              });
            }

            void handleLogout() async {
              handlePause();
              _phone.clear();
              _pass.clear();
            }

            Widget buildTaxiCheckerBorder() {
              return SizedBox(
                height: 12,
                child: Row(
                  children: List.generate(24, (index) => Expanded(
                    child: Container(
                      color: index % 2 == 0 ? const Color(0xFFFFB800) : Colors.black,
                    ),
                  )),
                ),
              );
            }

            Widget buildLogoCircle() {
              return Container(
                width: 86,
                height: 86,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  color: const Color(0xFFF3F4F6),
                  border: Border.all(color: const Color(0xFFFFB800), width: 3),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withOpacity(0.4),
                      blurRadius: 10,
                    )
                  ],
                ),
                child: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.local_taxi_rounded, color: Color(0xFFFFB800), size: 32),
                      const SizedBox(height: 1),
                      const Text(
                        "تكسي البلد",
                        style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 11),
                      ),
                      const Text(
                        "TAXI AL BALAD",
                        style: TextStyle(color: Color(0xFFFFB800), fontWeight: FontWeight.w900, fontSize: 6.5, letterSpacing: 0.5),
                      ),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: const [
                          Icon(Icons.phone, size: 6, color: Colors.black),
                          SizedBox(width: 2),
                          Text(
                            "0962750014",
                            style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 6.5),
                          ),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 20),
                      child: Container(
                        decoration: BoxDecoration(
                          color: const Color(0xFF1E1E1E),
                          borderRadius: BorderRadius.circular(32),
                          border: Border.all(color: const Color(0xFFFFB800), width: 1.5),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(30),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              buildTaxiCheckerBorder(),
                              const SizedBox(height: 22),
                              buildLogoCircle(),
                              const SizedBox(height: 16),
                              
                              if (!isOnline) ...[
                                // GİRİŞ EKRANI
                                const Text(
                                  "تكسي البلد | كابتن",
                                  style: TextStyle(
                                    color: Color(0xFFFFB800),
                                    fontSize: 22,
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                const SizedBox(height: 4),
                                const Text(
                                  "بوابة تسجيل دخول السائقين",
                                  style: TextStyle(color: Colors.grey, fontSize: 13),
                                ),
                                const SizedBox(height: 22),
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 20),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.end,
                                    children: [
                                      const Text("رقم الهاتف", style: TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 8),
                                      Container(
                                        decoration: BoxDecoration(
                                          color: Colors.white,
                                          borderRadius: BorderRadius.circular(12),
                                        ),
                                        child: TextField(
                                          controller: _phone,
                                          keyboardType: TextInputType.phone,
                                          style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            prefixIcon: Padding(
                                              padding: EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                                              child: Text("+963", style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 16)),
                                            ),
                                            hintText: "980040660",
                                            hintStyle: TextStyle(color: Colors.black26),
                                            contentPadding: EdgeInsets.symmetric(vertical: 13),
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 16),
                                      const Text("رمز المرور (PIN)", style: TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 8),
                                      Container(
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF282828),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(color: Colors.white12),
                                        ),
                                        child: TextField(
                                          controller: _pass,
                                          obscureText: true,
                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            suffixIcon: Icon(Icons.lock, color: Color(0xFFFFB800), size: 20),
                                            contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                                            hintText: "••••",
                                            hintStyle: TextStyle(color: Colors.white24),
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 22),
                                      ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: const Color(0xFFFFB800),
                                          minimumSize: const Size.fromHeight(50),
                                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                          elevation: 4,
                                        ),
                                        onPressed: isLoading ? null : handleLogin,
                                        child: isLoading
                                            ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(color: Colors.black, strokeWidth: 2))
                                            : Row(
                                                mainAxisAlignment: MainAxisAlignment.center,
                                                children: const [
                                                  Text("تسجيل الدخول", style: TextStyle(color: Colors.black, fontSize: 17, fontWeight: FontWeight.w900)),
                                                  SizedBox(width: 8),
                                                  Icon(Icons.login_rounded, color: Colors.black, size: 20),
                                                ],
                                              ),
                                      ),
                                    ],
                                  ),
                                ),
                              ] else ...[
                                // AKTİF SÜRÜCÜ EKRANI (1:1 Orijinal Tema)
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 18),
                                  child: Column(
                                    children: [
                                      // Sürücü Kartı
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 16),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF262628),
                                          borderRadius: BorderRadius.circular(18),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            // Sol Yeşil Durum Butonu
                                            Container(
                                              padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                                              decoration: BoxDecoration(
                                                color: const Color(0xFF1B3D2B),
                                                borderRadius: BorderRadius.circular(14),
                                                border: Border.all(color: const Color(0xFF2ECC71), width: 1.2),
                                              ),
                                              child: Column(
                                                children: const [
                                                  Text("متاح للعمل", style: TextStyle(color: Color(0xFF2ECC71), fontWeight: FontWeight.bold, fontSize: 13)),
                                                  Text("(أونلاين)", style: TextStyle(color: Color(0xFF2ECC71), fontWeight: FontWeight.bold, fontSize: 12)),
                                                ],
                                              ),
                                            ),
                                            // Sağ Sürücü Bilgisi
                                            Column(
                                              crossAxisAlignment: CrossAxisAlignment.end,
                                              children: [
                                                const Text("كابتن", style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
                                                const SizedBox(height: 2),
                                                Text(driverName, style: const TextStyle(color: Colors.white, fontSize: 17, fontWeight: FontWeight.w900)),
                                                const SizedBox(height: 4),
                                                Row(
                                                  children: [
                                                    Text(driverId, style: const TextStyle(color: Color(0xFFFFB800), fontWeight: FontWeight.bold, fontSize: 13)),
                                                    const SizedBox(width: 4),
                                                    const Icon(Icons.location_on, color: Color(0xFFFFB800), size: 16),
                                                  ],
                                                ),
                                                const SizedBox(height: 2),
                                                Text(driverCity, style: const TextStyle(color: Color(0xFFFFB800), fontWeight: FontWeight.bold, fontSize: 12)),
                                              ],
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // Mavi GPS Butonu
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF1E2D4A),
                                          borderRadius: BorderRadius.circular(22),
                                          border: Border.all(color: const Color(0xFF3B82F6), width: 1),
                                        ),
                                        child: Row(
                                          mainAxisSize: MainAxisSize.min,
                                          children: [
                                            Container(
                                              width: 9,
                                              height: 9,
                                              decoration: const BoxDecoration(
                                                shape: BoxShape.circle,
                                                color: Color(0xFF3B82F6),
                                              ),
                                            ),
                                            const SizedBox(width: 8),
                                            Text("GPS نشط ($driverCity)", style: const TextStyle(color: Color(0xFF60A5FA), fontWeight: FontWeight.bold, fontSize: 13)),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // Abonelik Kalan Gün Kutusu
                                      Container(
                                        width: double.infinity,
                                        padding: const EdgeInsets.symmetric(vertical: 20),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFF1E1E1E),
                                          borderRadius: BorderRadius.circular(18),
                                          border: Border.all(color: Colors.white12),
                                        ),
                                        child: Column(
                                          children: [
                                            const Text("الأيام المتبقية في اشتراكك", style: TextStyle(color: Colors.white70, fontSize: 15, fontWeight: FontWeight.w600)),
                                            const SizedBox(height: 6),
                                            Text(
                                              "$remainingDays",
                                              style: const TextStyle(color: Color(0xFFFFB800), fontSize: 48, fontWeight: FontWeight.w900),
                                            ),
                                            const SizedBox(height: 4),
                                            Text("ينتهي في: $expiryDate", style: const TextStyle(color: Colors.white60, fontSize: 13, fontWeight: FontWeight.bold)),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 18),

                                      // Kırmızı İstirahat Butonu
                                      ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: const Color(0xFFDC2626),
                                          minimumSize: const Size.fromHeight(52),
                                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                        ),
                                        onPressed: handlePause,
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: const [
                                            Icon(Icons.pause, color: Colors.white, size: 22),
                                            SizedBox(width: 6),
                                            Text("أخذ استراحة (إيقاف الاستقبال)", style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // Çıkış Yap Bağlantısı
                                      GestureDetector(
                                        onTap: handleLogout,
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: const [
                                            Icon(Icons.logout_rounded, color: Colors.grey, size: 18),
                                            SizedBox(width: 6),
                                            Text("تسجيل الخروج", style: TextStyle(color: Colors.grey, fontSize: 14, fontWeight: FontWeight.bold)),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                              const SizedBox(height: 24),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 7. APK Derleme
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk



