name: Build Driver Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Driver Application
        run: |
          rm -rf *
          flutter config --no-analytics
          flutter create --org com.taxialbalad --project-name driver_app build_app
          cd build_app
          
          # 1. Kütüphaneleri ekle
          flutter pub add geolocator http permission_handler wakelock_plus

          # 2. JVM Bellek Ayarları
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 3. Kotlin 1.9.22 Güncellemesi
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle

          # 4. SDK Sürümlerini ve Debug İmzasını Ayarla
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

          # 5. Android Manifest
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.taxialbalad.driver_app">
              
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              
              <application
                  android:label="كابتن تكسي البلد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 6. Canlı Hareket & GPS Sinyal Kodu (lib/main.dart)
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:http/http.dart' as http;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          const String FIREBASE_URL = "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/drivers";

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: DriverApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class DriverApp extends StatefulWidget {
            const DriverApp({super.key});

            @override
            State<DriverApp> createState() => _DriverAppState();
          }

          class _DriverAppState extends State<DriverApp> {
            final _phone = TextEditingController();
            final _pass = TextEditingController();
            bool isOnline = false;
            bool isLoading = false;
            String driverName = "";
            String activeKey = "";
            StreamSubscription<Position>? _positionStream;
            Timer? _heartbeatTimer;

            Future<void> sendDriverLocation(String key, Position pos) async {
              try {
                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$key.json"),
                  body: json.encode({
                    'lat': pos.latitude,
                    'lng': pos.longitude,
                    'latitude': pos.latitude,
                    'longitude': pos.longitude,
                    'speed': pos.speed > 0 ? pos.speed : 0.0,
                    'heading': pos.heading,
                    'bearing': pos.heading,
                    'accuracy': pos.accuracy,
                    'isMoving': pos.speed > 0.5,
                    'status': 'available',
                    'isOnline': true,
                    'online': true,
                    'active': true,
                    'workingStatus': 'working',
                    'lastGpsUpdate': now,
                    'lastActive': now,
                    'timestamp': now,
                  }),
                );
              } catch (_) {}
            }

            Future<void> updateDriverOffline(String key) async {
              try {
                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$key.json"),
                  body: json.encode({
                    'status': 'offline',
                    'isOnline': false,
                    'online': false,
                    'active': false,
                    'isMoving': false,
                    'workingStatus': 'resting',
                    'lastActive': now,
                  }),
                );
              } catch (_) {}
            }

            Future<void> startTracking(String key, String name) async {
              try {
                LocationPermission permission = await Geolocator.checkPermission();
                if (permission == LocationPermission.denied) {
                  permission = await Geolocator.requestPermission();
                  if (permission == LocationPermission.denied) {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text("يرجى إعطاء إذن الوصول للموقع لتفعيل الخدمة")),
                      );
                    }
                    return;
                  }
                }

                if (permission == LocationPermission.deniedForever) {
                  await openAppSettings();
                  return;
                }

                await WakelockPlus.enable();
                await Permission.ignoreBatteryOptimizations.request();

                // İlk konum
                try {
                  Position initialPos = await Geolocator.getCurrentPosition(
                    desiredAccuracy: LocationAccuracy.bestForNavigation,
                    timeLimit: const Duration(seconds: 4),
                  );
                  await sendDriverLocation(key, initialPos);
                } catch (_) {}

                // Canlı GPS Dinleme (0 metre hassasiyet)
                const LocationSettings locationSettings = LocationSettings(
                  accuracy: LocationAccuracy.bestForNavigation,
                  distanceFilter: 0,
                );

                _positionStream?.cancel();
                _positionStream = Geolocator.getPositionStream(locationSettings: locationSettings).listen(
                  (Position position) {
                    sendDriverLocation(key, position);
                  },
                  onError: (err) {},
                );

                // Periyodik Canlı Tutma Sinyali (Her 3 saniyede bir admin paneline canlı sinyal atar)
                _heartbeatTimer?.cancel();
                _heartbeatTimer = Timer.periodic(const Duration(seconds: 3), (timer) async {
                  try {
                    Position currentPos = await Geolocator.getCurrentPosition(
                      desiredAccuracy: LocationAccuracy.high,
                      timeLimit: const Duration(seconds: 2),
                    );
                    await sendDriverLocation(key, currentPos);
                  } catch (_) {}
                });

                if (mounted) {
                  setState(() {
                    isOnline = true;
                    driverName = name;
                    activeKey = key;
                  });
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("خطأ: $e")));
                }
              }
            }

            void stopTracking() async {
              _positionStream?.cancel();
              _positionStream = null;
              _heartbeatTimer?.cancel();
              _heartbeatTimer = null;
              WakelockPlus.disable();
              if (activeKey.isNotEmpty) {
                await updateDriverOffline(activeKey);
              }
              setState(() {
                isOnline = false;
              });
            }

            void handleLogin() async {
              FocusScope.of(context).unfocus();
              String p = _phone.text.trim().replaceAll(RegExp(r'[^0-9]'), '');
              String pass = _pass.text.trim();
              if (p.isEmpty || pass.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("يرجى إدخال رقم الهاتف ورمز المرور")),
                );
                return;
              }

              if (p.startsWith('0')) p = '963${p.substring(1)}';
              else if (!p.startsWith('963')) p = '963$p';

              setState(() => isLoading = true);

              try {
                final res = await http.get(Uri.parse("$FIREBASE_URL.json"));
                if (res.statusCode == 200 && res.body != "null") {
                  Map data = json.decode(res.body);
                  String? matchKey;
                  String? matchName;

                  data.forEach((k, v) {
                    String cleanP = (v['phone'] ?? '').toString().replaceAll(RegExp(r'[^0-9]'), '');
                    if (cleanP.contains(p) || p.contains(cleanP)) {
                      if (v['password'].toString() == pass) {
                        matchKey = k;
                        matchName = v['name'] ?? 'كابتن';
                      }
                    }
                  });

                  if (matchKey != null) {
                    await startTracking(matchKey!, matchName!);
                  } else {
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(
                        const SnackBar(content: Text("رقم الهاتف أو رمز المرور غير صحيح")),
                      );
                    }
                  }
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text("فشل الاتصال بالإنترنت: $e")),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() => isLoading = false);
                }
              }
            }

            Widget buildTaxiBorderHeader() {
              return SizedBox(
                height: 14,
                child: Row(
                  children: List.generate(18, (index) => Expanded(
                    child: Container(
                      color: index % 2 == 0 ? const Color(0xFFFFB800) : Colors.black,
                    ),
                  )),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF141414),
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 25),
                      child: Container(
                        decoration: BoxDecoration(
                          color: const Color(0xFF1C1C1E),
                          borderRadius: BorderRadius.circular(28),
                          border: Border.all(color: const Color(0xFFFFB800), width: 2),
                          boxShadow: [
                            BoxShadow(
                              color: const Color(0xFFFFB800).withOpacity(0.12),
                              blurRadius: 20,
                              spreadRadius: 2,
                            ),
                          ],
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(26),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              buildTaxiBorderHeader(),
                              const SizedBox(height: 25),
                              
                              // Logo Alanı
                              Container(
                                width: 100,
                                height: 100,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: Colors.white,
                                  border: Border.all(color: const Color(0xFFFFB800), width: 3),
                                  boxShadow: [
                                    BoxShadow(
                                      color: Colors.black.withOpacity(0.3),
                                      blurRadius: 10,
                                    )
                                  ]
                                ),
                                child: Center(
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: const [
                                      Icon(Icons.local_taxi, color: Color(0xFFFFB800), size: 38),
                                      SizedBox(height: 2),
                                      Text(
                                        "تكسي البلد",
                                        style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 13),
                                      ),
                                      Text(
                                        "TAXI AL BALAD",
                                        style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold, fontSize: 7),
                                      ),
                                    ],
                                  ),
                                ),
                              ),
                              
                              const SizedBox(height: 18),
                              const Text(
                                "تكسي البلد | كابتن",
                                style: TextStyle(
                                  color: Color(0xFFFFB800),
                                  fontSize: 24,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                              const SizedBox(height: 6),
                              const Text(
                                "بوابة تسجيل دخول السائقين",
                                style: TextStyle(color: Colors.grey, fontSize: 14),
                              ),
                              const SizedBox(height: 25),

                              // Form Alanı
                              Padding(
                                padding: const EdgeInsets.symmetric(horizontal: 22),
                                child: isOnline
                                    ? Column(
                                        children: [
                                          Container(
                                            padding: const EdgeInsets.all(16),
                                            decoration: BoxDecoration(
                                              color: Colors.green.withOpacity(0.1),
                                              shape: BoxShape.circle,
                                            ),
                                            child: const Icon(Icons.check_circle, color: Color(0xFF2ECC71), size: 75),
                                          ),
                                          const SizedBox(height: 18),
                                          Text(
                                            "مرحباً بك كابتن $driverName",
                                            textAlign: TextAlign.center,
                                            style: const TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold),
                                          ),
                                          const SizedBox(height: 10),
                                          const Text(
                                            "أنت الآن متصل وتطبيقك يرسل تحديثات الموقع المباشرة كل ثوانٍ إلى لوحة التحكم",
                                            textAlign: TextAlign.center,
                                            style: TextStyle(color: Colors.grey, fontSize: 14, height: 1.4),
                                          ),
                                          const SizedBox(height: 30),
                                          ElevatedButton(
                                            style: ElevatedButton.styleFrom(
                                              backgroundColor: const Color(0xFFE74C3C),
                                              minimumSize: const Size.fromHeight(55),
                                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                                              elevation: 4,
                                            ),
                                            onPressed: stopTracking,
                                            child: const Text(
                                              "إيقاف الاستقبال والعمل (استراحة)",
                                              style: TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold),
                                            ),
                                          ),
                                        ],
                                      )
                                    : Column(
                                        crossAxisAlignment: CrossAxisAlignment.end,
                                        children: [
                                          const Text("رقم الهاتف", style: TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.bold)),
                                          const SizedBox(height: 8),
                                          Container(
                                            decoration: BoxDecoration(
                                              color: Colors.white,
                                              borderRadius: BorderRadius.circular(14),
                                            ),
                                            child: TextField(
                                              controller: _phone,
                                              keyboardType: TextInputType.phone,
                                              style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 17),
                                              decoration: const InputDecoration(
                                                border: InputBorder.none,
                                                prefixIcon: Padding(
                                                  padding: EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                                                  child: Text("+963", style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 17)),
                                                ),
                                                hintText: "962750014",
                                                hintStyle: TextStyle(color: Colors.black26),
                                                contentPadding: EdgeInsets.symmetric(vertical: 14),
                                              ),
                                            ),
                                          ),
                                          const SizedBox(height: 18),
                                          const Text("رمز المرور (PIN)", style: TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.bold)),
                                          const SizedBox(height: 8),
                                          Container(
                                            decoration: BoxDecoration(
                                              color: const Color(0xFF2C2C2E),
                                              borderRadius: BorderRadius.circular(14),
                                              border: Border.all(color: Colors.white12),
                                            ),
                                            child: TextField(
                                              controller: _pass,
                                              obscureText: true,
                                              style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16),
                                              decoration: const InputDecoration(
                                                border: InputBorder.none,
                                                suffixIcon: Icon(Icons.lock, color: Color(0xFFFFB800)),
                                                contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                                                hintText: "••••",
                                                hintStyle: TextStyle(color: Colors.white24),
                                              ),
                                            ),
                                          ),
                                          const SizedBox(height: 25),
                                          ElevatedButton(
                                            style: ElevatedButton.styleFrom(
                                              backgroundColor: const Color(0xFFFFB800),
                                              minimumSize: const Size.fromHeight(55),
                                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                                              elevation: 5,
                                            ),
                                            onPressed: isLoading ? null : handleLogin,
                                            child: isLoading
                                                ? const CircularProgressIndicator(color: Colors.black)
                                                : Row(
                                                    mainAxisAlignment: MainAxisAlignment.center,
                                                    children: const [
                                                      Text("تسجيل الدخول", style: TextStyle(color: Colors.black, fontSize: 18, fontWeight: FontWeight.w900)),
                                                      SizedBox(width: 8),
                                                      Icon(Icons.login, color: Colors.black),
                                                    ],
                                                  ),
                                          ),
                                        ],
                                      ),
                              ),
                              const SizedBox(height: 30),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          # 7. APK Derleme
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk


