name: Build Driver Standalone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build Driver Application
        run: |
          flutter config --no-analytics
          flutter create --org com.taxialbalad --project-name driver_app build_app
          cd build_app
          
          mkdir -p assets
          if [ -f "../logo.jpg" ]; then
            cp ../logo.jpg assets/logo.jpg
          elif [ -f "../logo.png" ]; then
            cp ../logo.png assets/logo.jpg
          else
            python3 -c '
          import base64
          raw = ""
          with open("assets/logo.jpg", "wb") as f:
              f.write(base64.b64decode(raw))
          '
          fi

          cat << 'EOF' > pubspec.yaml
          name: driver_app
          description: Taxi Al Balad Driver App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^13.0.2
            http: ^1.2.0
            permission_handler: ^11.3.1
            wakelock_plus: ^1.2.8
            flutter_foreground_task: ^7.0.1
          flutter:
            uses-material-design: true
            assets:
              - assets/logo.jpg
          EOF

          flutter pub get

          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle

          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.pravera.flutter_foreground_task.** { *; }
          -keep class com.baseflow.geolocator.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.taxialbalad.driver_app"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  applicationId = "com.taxialbalad.driver_app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.taxialbalad.driver_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              
              <application
                  android:label="كابتن تكسي البلد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <service 
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:foregroundServiceType="location"
                      android:stopWithTask="false"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:isolate';
          import 'package:flutter/material.dart';
          import 'package:flutter_foreground_task/flutter_foreground_task.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:http/http.dart' as http;
          import 'package:permission_handler/permission_handler.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          const String FIREBASE_URL = "https://taxialbalad-85453-default-rtdb.europe-west1.firebasedatabase.app/drivers";

          @pragma('vm:entry-point')
          void startCallback() {
            FlutterForegroundTask.setTaskHandler(DriverTaskHandler());
          }

          class DriverTaskHandler extends TaskHandler {
            String? driverKey;

            @override
            void onStart(DateTime timestamp, SendPort? sendPort) async {
              driverKey = await FlutterForegroundTask.getData<String>(key: 'activeDriverKey');
            }

            @override
            void onRepeatEvent(DateTime timestamp, SendPort? sendPort) async {
              driverKey ??= await FlutterForegroundTask.getData<String>(key: 'activeDriverKey');
              if (driverKey == null || driverKey!.isEmpty) return;

              try {
                Position pos = await Geolocator.getCurrentPosition(
                  desiredAccuracy: LocationAccuracy.high,
                );
                int now = DateTime.now().millisecondsSinceEpoch;
                
                // Arka planda yolcu durumunu al
                bool hasPass = (await FlutterForegroundTask.getData<bool>(key: 'hasPassenger')) ?? false;

                await http.patch(
                  Uri.parse("$FIREBASE_URL/$driverKey.json"),
                  body: json.encode({
                    'lat': pos.latitude,
                    'lng': pos.longitude,
                    'latitude': pos.latitude,
                    'longitude': pos.longitude,
                    'speed': pos.speed > 0 ? pos.speed : 0.2,
                    'heading': pos.heading,
                    'isMoving': true,
                    'hasPassenger': hasPass,
                    'passengerStatus': hasPass ? 'with_passenger' : 'available',
                    'status': hasPass ? 'busy' : 'available',
                    'isOnline': true,
                    'lastGpsUpdate': now,
                    'lastActive': now,
                    'timestamp': now,
                  }),
                );

                String statusText = hasPass ? "معي راكب حالياً (مشغول)" : "متاح للعمل وجاهز للطلبات";
                FlutterForegroundTask.updateService(
                  notificationTitle: '🚖 كابتن تكسي البلد - متصل',
                  notificationText: statusText,
                );
              } catch (_) {}
            }

            @override
            void onDestroy(DateTime timestamp, SendPort? sendPort) async {}
            @override
            void onNotificationButtonPressed(String id) {}
            @override
            void onNotificationPressed() {}
            @override
            void onNotificationDismissed() {}
          }

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              home: DriverApp(),
              debugShowCheckedModeBanner: false,
            ));
          }

          class DriverApp extends StatefulWidget {
            const DriverApp({super.key});
            @override
            State<DriverApp> createState() => _DriverAppState();
          }

          class _DriverAppState extends State<DriverApp> with WidgetsBindingObserver {
            final _phone = TextEditingController();
            final _pass = TextEditingController();
            bool isOnline = false;
            bool isLoading = false;
            bool hasPassenger = false;
            
            String driverName = "Ahmad";
            String driverId = "12345";
            String driverCity = "دمشق";
            int remainingDays = 0;
            String expiryDate = "-";
            String activeKey = "";
            Timer? _locationTimer;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _initForegroundTask();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                _requestInitialPermissions();
              });
            }

            Future<void> _requestInitialPermissions() async {
              await Permission.notification.request();
              LocationPermission permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
              }
              if (permission == LocationPermission.whileInUse || permission == LocationPermission.always) {
                await Permission.locationAlways.request();
              }
              await Permission.ignoreBatteryOptimizations.request();
            }

            void _initForegroundTask() {
              FlutterForegroundTask.init(
                androidNotificationOptions: AndroidNotificationOptions(
                  channelId: 'taxi_driver_silent_service',
                  channelName: 'خدمة التتبع وتحديد الموقع',
                  channelDescription: 'تحديث موقع السائق كل دقيقة بهدوء',
                  channelImportance: NotificationChannelImportance.LOW,
                  priority: NotificationPriority.LOW,
                  playSound: false,
                  enableVibration: false,
                  showWhen: false,
                ),
                iosNotificationOptions: const IOSNotificationOptions(),
                foregroundTaskOptions: const ForegroundTaskOptions(
                  interval: 60000, // 60 saniyede bir (dakikada 1 kez)
                  isOnceEvent: false,
                  autoRunOnBoot: true,
                  allowWakeLock: true,
                ),
              );
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _locationTimer?.cancel();
              super.dispose();
            }

            // Doğru kalan gün hesabı
            int calculateRemainingDays(dynamic expiryTimestamp) {
              if (expiryTimestamp == null) return 0;
              int exp = int.tryParse(expiryTimestamp.toString()) ?? 0;
              int now = DateTime.now().millisecondsSinceEpoch;
              int diff = exp - now;
              if (diff <= 0) return 0;
              return (diff / (1000 * 60 * 60 * 24)).ceil();
            }

            Future<void> sendLocationToFirebase() async {
              if (activeKey.isEmpty) return;
              try {
                Position pos = await Geolocator.getCurrentPosition(
                  desiredAccuracy: LocationAccuracy.high,
                );
                int now = DateTime.now().millisecondsSinceEpoch;

                await http.patch(
                  Uri.parse("$FIREBASE_URL/$activeKey.json"),
                  body: json.encode({
                    'lat': pos.latitude,
                    'lng': pos.longitude,
                    'latitude': pos.latitude,
                    'longitude': pos.longitude,
                    'speed': pos.speed > 0 ? pos.speed : 0.2,
                    'heading': pos.heading,
                    'isMoving': true,
                    'hasPassenger': hasPassenger,
                    'passengerStatus': hasPassenger ? 'with_passenger' : 'available',
                    'status': hasPassenger ? 'busy' : 'available',
                    'isOnline': true,
                    'lastGpsUpdate': now,
                    'lastActive': now,
                    'timestamp': now,
                  }),
                );
              } catch (_) {}
            }

            // İŞE BAŞLA
            Future<void> handleStartWork() async {
              try {
                await WakelockPlus.enable();
                await FlutterForegroundTask.saveData(key: 'activeDriverKey', value: activeKey);
                await FlutterForegroundTask.saveData(key: 'hasPassenger', value: hasPassenger);

                if (await FlutterForegroundTask.isRunningService) {
                  await FlutterForegroundTask.restartService();
                } else {
                  await FlutterForegroundTask.startService(
                    notificationTitle: '🚖 كابتن تكسي البلد - متصل',
                    notificationText: hasPassenger ? 'معي راكب حالياً' : 'أنت متاح للعمل الآن',
                    callback: startCallback,
                  );
                }

                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$activeKey.json"),
                  body: json.encode({
                    'status': hasPassenger ? 'busy' : 'available',
                    'hasPassenger': hasPassenger,
                    'passengerStatus': hasPassenger ? 'with_passenger' : 'available',
                    'isOnline': true,
                    'workingStatus': 'working',
                    'lastActive': now,
                  }),
                );

                // İlk konumu fırlat ve 1 dakikalık döngüyü başlat
                await sendLocationToFirebase();
                _locationTimer?.cancel();
                _locationTimer = Timer.periodic(const Duration(minutes: 1), (timer) {
                  sendLocationToFirebase();
                });

                setState(() {
                  isOnline = true;
                });
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("خطأ في التشغيل: $e")));
              }
            }

            // İŞİ BİTİR / İSTİRAHATE ÇEKİL
            Future<void> handleStopWork() async {
              _locationTimer?.cancel();
              _locationTimer = null;
              WakelockPlus.disable();
              await FlutterForegroundTask.stopService();

              if (activeKey.isNotEmpty) {
                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$activeKey.json"),
                  body: json.encode({
                    'status': 'offline',
                    'isOnline': false,
                    'hasPassenger': false,
                    'passengerStatus': 'resting',
                    'workingStatus': 'resting',
                    'lastActive': now,
                  }),
                );
              }

              setState(() {
                isOnline = false;
                hasPassenger = false;
              });
            }

            // YOLCUM VAR / YOLCUM YOK BUTONU
            Future<void> togglePassengerStatus() async {
              bool newStatus = !hasPassenger;
              setState(() {
                hasPassenger = newStatus;
              });

              await FlutterForegroundTask.saveData(key: 'hasPassenger', value: newStatus);

              if (activeKey.isNotEmpty) {
                int now = DateTime.now().millisecondsSinceEpoch;
                await http.patch(
                  Uri.parse("$FIREBASE_URL/$activeKey.json"),
                  body: json.encode({
                    'status': newStatus ? 'busy' : 'available',
                    'hasPassenger': newStatus,
                    'passengerStatus': newStatus ? 'with_passenger' : 'available',
                    'lastActive': now,
                  }),
                );
                // Anında konumu da güncelle
                sendLocationToFirebase();
              }
            }

            void handleLogin() async {
              FocusScope.of(context).unfocus();
              String p = _phone.text.trim().replaceAll(RegExp(r'[^0-9]'), '');
              String pass = _pass.text.trim();
              if (p.isEmpty || pass.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text("يرجى إدخال رقم الهاتف ورمز المرور")),
                );
                return;
              }

              if (p.startsWith('0')) p = '963${p.substring(1)}';
              else if (!p.startsWith('963')) p = '963$p';

              setState(() => isLoading = true);

              try {
                final res = await http.get(Uri.parse("$FIREBASE_URL.json"));
                if (res.statusCode == 200 && res.body != "null") {
                  Map data = json.decode(res.body);
                  String? matchKey;
                  Map? matchData;

                  data.forEach((k, v) {
                    String cleanP = (v['phone'] ?? '').toString().replaceAll(RegExp(r'[^0-9]'), '');
                    if (cleanP.contains(p) || p.contains(cleanP)) {
                      if (v['password'].toString() == pass) {
                        matchKey = k;
                        matchData = v;
                      }
                    }
                  });

                  if (matchKey != null && matchData != null) {
                    activeKey = matchKey!;
                    driverName = matchData!['name'] ?? 'الكابتن';
                    driverId = (matchData!['driverId'] ?? matchData!['car'] ?? '12345').toString();
                    driverCity = matchData!['city'] ?? 'دمشق';
                    
                    // Kalan günün hesaplanması
                    remainingDays = calculateRemainingDays(matchData!['expiryTimestamp']);
                    expiryDate = matchData!['expiryDate'] ?? "$remainingDays يوم";
                    hasPassenger = matchData!['hasPassenger'] ?? false;

                    // Giriş yapınca varsayılan olarak işe başlasın
                    await handleStartWork();
                  } else {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(content: Text("رقم الهاتف أو رمز المرور غير صحيح")),
                    );
                  }
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text("فشل الاتصال بالخادم: $e")),
                );
              } finally {
                if (mounted) setState(() => isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF101010),
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 20),
                      child: Container(
                        decoration: BoxDecoration(
                          color: const Color(0xFF1C1C1E),
                          borderRadius: BorderRadius.circular(30),
                          border: Border.all(color: const Color(0xFFFFB800), width: 1.5),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(28),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              // Taksi Damalı Şerit
                              SizedBox(
                                height: 12,
                                child: Row(
                                  children: List.generate(24, (i) => Expanded(
                                    child: Container(color: i % 2 == 0 ? const Color(0xFFFFB800) : Colors.black),
                                  )),
                                ),
                              ),
                              const SizedBox(height: 20),
                              
                              // Logo
                              Container(
                                width: 100,
                                height: 100,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: Colors.white,
                                  border: Border.all(color: const Color(0xFFFFB800), width: 3),
                                ),
                                child: ClipOval(
                                  child: Image.asset('assets/logo.jpg', fit: BoxFit.contain,
                                    errorBuilder: (c, e, s) => const Icon(Icons.local_taxi, color: Color(0xFFFFB800), size: 48)),
                                ),
                              ),
                              const SizedBox(height: 16),

                              if (!isOnline && activeKey.isEmpty) ...[
                                // GİRİŞ EKRANI
                                const Text("تكسي البلد | كابتن", style: TextStyle(color: Color(0xFFFFB800), fontSize: 22, fontWeight: FontWeight.w900)),
                                const SizedBox(height: 4),
                                const Text("بوابة تسجيل دخول السائقين", style: TextStyle(color: Colors.white60, fontSize: 13)),
                                const SizedBox(height: 20),
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 20),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.end,
                                    children: [
                                      const Text("رقم الهاتف", style: TextStyle(color: Colors.white70, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 6),
                                      Container(
                                        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(12)),
                                        child: TextField(
                                          controller: _phone,
                                          keyboardType: TextInputType.phone,
                                          style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            prefixIcon: Padding(
                                              padding: EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                                              child: Text("+963", style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 16)),
                                            ),
                                            hintText: "980040660",
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 14),
                                      const Text("رمز المرور (PIN)", style: TextStyle(color: Colors.white70, fontSize: 13, fontWeight: FontWeight.bold)),
                                      const SizedBox(height: 6),
                                      Container(
                                        decoration: BoxDecoration(color: const Color(0xFF282828), borderRadius: BorderRadius.circular(12)),
                                        child: TextField(
                                          controller: _pass,
                                          obscureText: true,
                                          style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16),
                                          decoration: const InputDecoration(
                                            border: InputBorder.none,
                                            suffixIcon: Icon(Icons.lock, color: Color(0xFFFFB800), size: 20),
                                            contentPadding: EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                                            hintText: "••••",
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 20),
                                      ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: const Color(0xFFFFB800),
                                          minimumSize: const Size.fromHeight(50),
                                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                        ),
                                        onPressed: isLoading ? null : handleLogin,
                                        child: isLoading
                                            ? const SizedBox(width: 22, height: 22, child: CircularProgressIndicator(color: Colors.black, strokeWidth: 2))
                                            : const Text("تسجيل الدخول", style: TextStyle(color: Colors.black, fontSize: 17, fontWeight: FontWeight.w900)),
                                      ),
                                    ],
                                  ),
                                ),
                              ] else ...[
                                // SÜRÜCÜ KONTROL PANELİ
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 18),
                                  child: Column(
                                    children: [
                                      // Durum Çubuğu
                                      Container(
                                        width: double.infinity,
                                        padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 12),
                                        decoration: BoxDecoration(
                                          color: isOnline
                                              ? (hasPassenger ? const Color(0xFF5C3300) : const Color(0xFF1B3D2B))
                                              : const Color(0xFF2C2C2E),
                                          borderRadius: BorderRadius.circular(12),
                                          border: Border.all(
                                            color: isOnline
                                                ? (hasPassenger ? Colors.orange : const Color(0xFF2ECC71))
                                                : Colors.grey,
                                          ),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Icon(
                                              isOnline
                                                  ? (hasPassenger ? Icons.person : Icons.check_circle)
                                                  : Icons.pause_circle_filled,
                                              color: isOnline
                                                  ? (hasPassenger ? Colors.orange : const Color(0xFF2ECC71))
                                                  : Colors.grey,
                                              size: 18,
                                            ),
                                            const SizedBox(width: 8),
                                            Text(
                                              isOnline
                                                  ? (hasPassenger ? "معك راكب حالياً • تظهر بالبرتقالي في الرادار" : "أنت متصل ومتاح للركاب • تظهر بالأخضر")
                                                  : "أنت في وضع الاستراحة (غير متصل)",
                                              style: TextStyle(
                                                color: isOnline
                                                    ? (hasPassenger ? Colors.orange : const Color(0xFF2ECC71))
                                                    : Colors.grey,
                                                fontWeight: FontWeight.bold,
                                                fontSize: 12,
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // Kaptan Kartı
                                      Container(
                                        padding: const EdgeInsets.all(14),
                                        decoration: BoxDecoration(color: const Color(0xFF262628), borderRadius: BorderRadius.circular(16)),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: [
                                            Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Text(driverCity, style: const TextStyle(color: Color(0xFFFFB800), fontWeight: FontWeight.bold, fontSize: 13)),
                                                const SizedBox(height: 2),
                                                Text(driverId, style: const TextStyle(color: Colors.white70, fontSize: 12)),
                                              ],
                                            ),
                                            Column(
                                              crossAxisAlignment: CrossAxisAlignment.end,
                                              children: [
                                                const Text("الكابتن", style: TextStyle(color: Colors.white60, fontSize: 12)),
                                                Text(driverName, style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.w900)),
                                              ],
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // Kalan Gün Kartı (Tam Doğru Gün Hesabı)
                                      Container(
                                        width: double.infinity,
                                        padding: const EdgeInsets.symmetric(vertical: 14),
                                        decoration: BoxDecoration(color: const Color(0xFF1E1E1E), borderRadius: BorderRadius.circular(16), border: Border.all(color: Colors.white12)),
                                        child: Column(
                                          children: [
                                            const Text("الأيام المتبقية في اشتراكك", style: TextStyle(color: Colors.white70, fontSize: 14)),
                                            const SizedBox(height: 4),
                                            Text(
                                              "$remainingDays",
                                              style: TextStyle(
                                                color: remainingDays <= 2 ? Colors.red : const Color(0xFFFFB800),
                                                fontSize: 42,
                                                fontWeight: FontWeight.w900,
                                              ),
                                            ),
                                            Text(
                                              remainingDays <= 0 ? "انتهى الاشتراك - يرجى التجديد" : "أيام متبقية للعمل",
                                              style: TextStyle(color: remainingDays <= 0 ? Colors.red : Colors.white60, fontSize: 12, fontWeight: FontWeight.bold),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 16),

                                      // 1. BUTON: YOLCUM VAR / YOLCUM YOK (MÜSAİT)
                                      if (isOnline) ...[
                                        ElevatedButton(
                                          style: ElevatedButton.styleFrom(
                                            backgroundColor: hasPassenger ? const Color(0xFF2ECC71) : const Color(0xFFF97316), // Turuncu veya Yeşil
                                            minimumSize: const Size.fromHeight(54),
                                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                            elevation: 4,
                                          ),
                                          onPressed: togglePassengerStatus,
                                          child: Row(
                                            mainAxisAlignment: MainAxisAlignment.center,
                                            children: [
                                              Icon(hasPassenger ? Icons.check_circle_outline : Icons.airline_seat_recline_normal, color: Colors.white, size: 24),
                                              const SizedBox(width: 8),
                                              Text(
                                                hasPassenger ? "أنهيت الرحلة (أنا جاهز ومتاح الآن)" : "معي راكب حالياً (تحويل للبرتقالي)",
                                                style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.w900),
                                              ),
                                            ],
                                          ),
                                        ),
                                        const SizedBox(height: 10),
                                      ],

                                      // 2. BUTON: İŞE BAŞLA / İŞİ BİTİR (MOLAYA ÇIK)
                                      ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: isOnline ? const Color(0xFFDC2626) : const Color(0xFF10B981),
                                          minimumSize: const Size.fromHeight(50),
                                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                        ),
                                        onPressed: () {
                                          if (isOnline) {
                                            handleStopWork();
                                          } else {
                                            handleStartWork();
                                          }
                                        },
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.center,
                                          children: [
                                            Icon(isOnline ? Icons.pause_circle_outline : Icons.play_circle_fill, color: Colors.white, size: 22),
                                            const SizedBox(width: 8),
                                            Text(
                                              isOnline ? "إنهاء العمل (أخذ استراحة)" : "بدء العمل وتشغيل العداد والموقع",
                                              style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                            ),
                                          ],
                                        ),
                                      ),
                                      const SizedBox(height: 14),

                                      // ÇIKIŞ YAP
                                      GestureDetector(
                                        onTap: () {
                                          handleStopWork();
                                          setState(() {
                                            activeKey = "";
                                            _phone.clear();
                                            _pass.clear();
                                          });
                                        },
                                        child: const Text("تسجيل الخروج من الحساب", style: TextStyle(color: Colors.grey, fontSize: 13, fontWeight: FontWeight.bold)),
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                              const SizedBox(height: 20),
                            ],
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
